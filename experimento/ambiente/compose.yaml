# Broker Apache Kafka para o experimento. Um nó, KRaft, versão fixada.
#
# Os três protocolos de rebalanceamento sobem neste mesmo broker: o Kafka 4.x habilita o
# protocolo novo (KIP-848) no servidor por padrão e mantém o clássico. A escolha do
# protocolo é feita por cliente (ver coletor/README.md).
#
# Tempo de sessão igual nos três protocolos: 10 s de sessão, 3 s de sinal de vida.
# No clássico esses valores são configuração do cliente; no KIP-848 são do servidor, e o
# mínimo padrão (45 s) precisa ser reduzido aqui para que 10 s seja aceito.
#
# Subir:    docker compose -f ambiente/compose.yaml up -d
# Derrubar: docker compose -f ambiente/compose.yaml down -v

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: tcc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Protocolo clássico: o atraso inicial de rebalanceamento entraria no tempo órfão da
      # primeira visão sem relação com o protocolo; zerado e documentado.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 6000

      # KIP-848: sessão e sinal de vida são definidos no servidor.
      KAFKA_GROUP_CONSUMER_MIN_SESSION_TIMEOUT_MS: 10000
      KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS: 10000
      KAFKA_GROUP_CONSUMER_MIN_HEARTBEAT_INTERVAL_MS: 3000
      KAFKA_GROUP_CONSUMER_HEARTBEAT_INTERVAL_MS: 3000

      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
